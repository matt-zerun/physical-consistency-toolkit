[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-consistency-toolkit"
version = "0.2.0"
description = "Post-hoc response-surface diagnostics and thermal-conductivity regression"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mateusz Żeruń"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
xgboost = ["xgboost>=2.0"]
interactive = ["plotly>=5.18"]

[project.scripts]
pci-toolkit = "physical_consistency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
